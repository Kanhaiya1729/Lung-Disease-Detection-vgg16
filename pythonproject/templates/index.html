<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pneumonia Detection from Chest X-ray</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f7fafc;
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
        }
        .center-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100vh;
            padding-top: 40px;
        }
        .upload-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 22px 0 rgba(0,0,0,0.10);
            padding: 42px 52px 32px 52px;
            margin-right: 60px;
            width: 350px;
            min-height: 420px;
        }
        .upload-card h1 {
            font-size: 2.1em;
            font-weight: 700;
            color: #22223b;
            margin-bottom: 18px;
            letter-spacing: 0.04em;
        }
        .file-btn {
            display: inline-block;
            background: #009688;
            color: #fff;
            font-weight: bold;
            padding: 9px 18px;
            border-radius: 6px;
            border: none;
            margin-bottom: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-btn:hover {
            background: #00796b;
        }
        label[for="file"] {
            margin-right: 10px;
        }
        .predict-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 13px 27px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            margin-top: 16px;
            letter-spacing: .05em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .predict-btn:hover {
            background: #1e40af;
        }
        .result-section {
            margin-top: 38px;
        }
        .result-title {
            font-weight: bold;
            color: #22223b;
            font-size: 1.16em;
        }
        .result-value {
            color: #2563eb;
            font-size: 1.15em;
            font-weight: bold;
            margin-bottom: 0.2em;
        }
        .confidence {
            color: #009688;
        }
        /* Image card */
        .image-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 22px 0 rgba(0,0,0,0.13);
            padding: 22px;
            min-width: 340px;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-card img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 14px;
            border: 2px solid #f4f4f4;
            box-shadow: 0 2px 8px 0 rgba(0,0,0,0.10);
        }
        @media (max-width:900px) {
            .center-container { flex-direction: column; align-items: center; }
            .upload-card { margin-right: 0; margin-bottom: 32px; }
        }
        @media (max-width:600px) {
            .upload-card, .image-card { width: 90vw; min-width: unset; }
            .image-card { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="center-container">
        <div class="upload-card">
            <h1>Pneumonia Detection</h1>
            <form method="POST" enctype="multipart/form-data">
                <label for="file" class="file-btn">Select Chest X-ray
                  <input type="file" id="file" name="file" accept="image/*" style="display:none" required>
                </label>
                <span id="file-chosen">No file selected</span><br>
                <button class="predict-btn" type="submit">Predict</button>
            </form>
            <div class="result-section">
                <div class="result-title">Prediction:</div>
                <div class="result-value">{{ prediction }}</div>
                <div class="result-title">Confidence:</div>
                <div class="result-value confidence">{{ confidence }}%</div>
            </div>
        </div>
        <div class="image-card">
            {% if image %}
                <img src="data:image/png;base64,{{ image }}" alt="X-ray Image">
            {% else %}
                <span style="color: #bbb; font-size:1.1em;">No X-ray image uploaded<br><br>Upload a file to preview!</span>
            {% endif %}
        </div>
    </div>
    <script>
      const fileInput = document.getElementById('file');
      const fileChosen = document.getElementById('file-chosen');
      fileInput.addEventListener('change', function(){
          fileChosen.textContent = this.files[0] ? this.files[0].name : 'No file selected';
      });
    </script>
</body>
</html>
